server {
    client_max_body_size 6m;
    listen 80;

    location = / { return 308 /schedule; }
    location = /robots.txt { proxy_pass http://app:8080/web/robots.txt; }
    location = /schedule { proxy_pass http://app:8080/web/schedule; }
    location ^~ /schedule/room/ { proxy_pass http://app:8080/web/schedule/room/; }
    location ~ ^/(login|register|admin|my-bookings|booking/confirmed)/?$ {
        root /usr/share/nginx/html;
        try_files /index.html =404;
    }
    error_page 404 /index.html;

    gzip on;
    gzip_min_length 1000;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    location = /sitemap.xml {
        proxy_pass http://app:8080/api/v1/sitemap;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /assets/ {
        root /usr/share/nginx/html;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ =404;
    }

    location /api/ {
        proxy_pass http://app:8080;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /favicon.ico {
        log_not_found off;
        access_log off;
    }
}
